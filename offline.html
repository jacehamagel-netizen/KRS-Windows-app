<!doctype html><meta charset="utf-8"><title>KRS Portal</title>
<style>
body{font-family:system-ui,'Segoe UI',sans-serif;background:#f1f7fd;color:#256a9c;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center}
.card{background:#fff;border:1px solid #dbe8f4;border-radius:16px;padding:36px 44px;box-shadow:0 6px 20px rgba(47,143,223,.12);max-width:420px}
h2{margin:0 0 8px}p{color:#4a6a86;margin:6px 0}
button{margin-top:16px;background:#2f8fdf;color:#fff;border:0;border-radius:10px;padding:10px 22px;font-weight:700;cursor:pointer}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e0a030;margin-right:6px}
</style>
<div class="card"><h2>No internet connection</h2>
<p>The portal needs internet. We'll reconnect automatically as soon as you're back online.</p>
<p><span class="dot"></span><span id="s">Waiting for connection…</span></p>
<button onclick="location.href='krs-retry://now'">Try again now</button></div>
