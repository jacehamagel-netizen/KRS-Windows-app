<!doctype html><meta charset="utf-8"><title>KRS Portal</title>
<style>
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,'Segoe UI',sans-serif;color:#256a9c;background:linear-gradient(180deg,#e8f3fd,#ffffff);border:1px solid #cfe6f7;box-sizing:border-box}
img{width:96px;height:96px;object-fit:contain}
h1{font-size:17px;margin:0;font-weight:700}
.bar{width:160px;height:4px;background:#d9ecfa;border-radius:4px;overflow:hidden}
.bar i{display:block;width:40%;height:100%;background:#2f8fdf;border-radius:4px;animation:m 1.1s ease-in-out infinite}
@keyframes m{0%{margin-left:-40%}100%{margin-left:100%}}
</style>
<img src="logo.png" alt=""><h1>Kilifi Rising Star Academy</h1><div class="bar"><i></i></div>
